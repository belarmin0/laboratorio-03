apiVersion: v1
kind: Pod
metadata:
  labels:
    agente-jenkins: jenkins-agent-miguel-alarcon
spec:
  containers:
  - name: node-pnpm
    image: node:24-alpine
    command: ["cat"]
    tty: true
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "32Mi"
        cpu: "50m"
  - name: kubectl
    image: bitnami/kubectl:latest
    command: ["cat"]
    tty: true
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "32Mi"
        cpu: "50m"
  - name: buildkit
    image: moby/buildkit:latest
    command: ["cat"]
    tty: true
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "32Mi"
        cpu: "50m"
    volumeMounts:
    - name: regcred-dh-miguel-alarcon
      mountPath: /docker-configs/dockerhub
      readOnly: true
    - name: regcred-gh-miguel-alarcon
      mountPath: /docker-configs/github
      readOnly: true
 # - name: docker-cli
 #   image: docker:24.0-cli
 #   command: ["cat"]
 #   tty: true
 #   resources:
 #     limits:
 #       memory: "512Mi"
 #       cpu: "500m"
 #     requests:
 #       memory: "32Mi"
 #       cpu: "50m"
 #   volumeMounts:
 #   - name: docker-socket
 #     mountPath: /var/run/docker.sock
  volumes:
 # - name: docker-socket
 #   hostPath:
#      path: /var/run/docker.sock
  - name: regcred-dh-miguel-alarcon
    secret:
      secretName: secret-dh-miguel-alarcon
      items:
      - key: .dockerconfigjson
        path: config.json
  - name: regcred-gh-miguel-alarcon
    secret:
      secretName: secret-gh-miguel-alarcon
      items:
      - key: .dockerconfigjson
        path: config.json